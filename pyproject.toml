[project]
name = "odrive-gui"
version = "0.2.0"
description = "A web-based GUI to tweak and debug the ODrive motor controller"
readme = "README.md"
requires-python = ">=3.10"  # NiceGUI 3.x requires >=3.10
license = { text = "MIT" }
dependencies = [
    "nicegui>=3.0",
    # <0.6.10: odrive 0.6.10+ dropped the fibre-based API this GUI is built on — not only
    # `odrive.pyfibre` (src/controls.py) but also `odrive.start_discovery` / `connected_devices` /
    # `connected_devices_changed` (src/main.py's discovery loop), so avoiding the pyfibre import alone
    # would not unblock newer releases. 0.6.9.post0 is the last release that ships them (verified
    # against the PyPI wheels; open-ended >=0.6.2 resolved to 0.6.11.post0 and crashed on startup).
    "odrive>=0.6.2,<0.6.10",
    "matplotlib>=3.7.2",
]

[project.urls]
Homepage = "https://github.com/zauberzeug/odrive-gui"

[dependency-groups]
dev = [
    "ruff==0.15.19",  # pinned: single source of truth for the lint/format gate that CI runs
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# the app runs as scripts under src/ (python src/main.py); uv only manages the
# dependency set, it does not build/install this project as a package.
package = false

[tool.ruff]
# 150 matches the repo's established autopep8 convention (see .vscode/settings.json).
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
# Check against the advertised floor (requires-python >= 3.10) so 3.11/3.12-only stdlib
# usage is caught here — ruff's py310 target only catches 3.11+ *syntax*, not new stdlib APIs.
python_version = "3.10"
mypy_path = "src"
# the GUI talks to a live `fibre` remote object whose attributes are resolved at
# runtime, so the device side is intentionally dynamically typed.
ignore_missing_imports = true
check_untyped_defs = true

# numpy is only a transitive dependency (matplotlib, via ui.line_plot); src never imports it.
# On Python 3.12+ its installed stub uses a `type` statement that mypy cannot parse under
# python_version = "3.10" (`numpy/__init__.pyi: Type statement is only supported in Python 3.12`),
# so skip following it rather than raise the project's floor for a stub we don't use.
# (Passes without this on 3.10/3.11 interpreters, which is why it looked redundant once.)
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tools"]
testpaths = ["tests"]
# the NiceGUI `user` fixture (re)imports this module per test to register the page.
main_file = "tests/app_under_test.py"
